name: ledger-mock

services:
  postgres:
    image: postgres:16-alpine
    container_name: ledger-postgres
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - ledger-net

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: ledger-api
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://ledger:ledger_dev_password@postgres:5432/ledger
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 10s
    networks:
      - ledger-net

  realtime-cron:
    build:
      context: .
      dockerfile: ./apps/realtime-cron/Dockerfile
    container_name: ledger-realtime-cron
    environment:
      NODE_ENV: development
      PORT: 4100
      DATABASE_URL: postgresql://ledger:ledger_dev_password@postgres:5432/ledger
      API_BASE_URL: http://api:4000
      CRON_TICK_SECONDS: 15
    ports:
      - "4100:4100"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4100/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 4s
      retries: 10
      start_period: 15s
    networks:
      - ledger-net

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    container_name: ledger-web
    environment:
      NODE_ENV: development
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_CRON_URL: http://localhost:4100
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - ledger-net

volumes:
  postgres_data:

networks:
  ledger-net:
    driver: bridge
